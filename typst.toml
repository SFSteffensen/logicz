[package]
name = "logicz"
version = "0.1.1"
compiler = "0.14.0"
entrypoint = "src/exports.typ"
authors = ["Sebastian Steffensen <@SFSteffensen>"]
license = "MIT"
description = "Draw logic gate diagrams from a tiny netlist language."
repository = "https://github.com/SFSteffensen/logicz"
categories = ["visualization", "components"]
disciplines = ["computer-science", "engineering"]
keywords = [
	"circuit",
	"logic",
	"gate",
	"digital",
	"schematic",
	"boolean",
	"IEEE 91",
	"diagram",
]
exclude = ["docs/", "tests/", ".github/", "dist/", "justfile", ".gitignore"]
